# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Documentation examples: the default admin:admin login of the local development and demo containers."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/Installation/demo\-environment\.md$''',
  '''(^|/)docs/e2e\.md$''',
]

[[allowlists]]
description = "End-to-end test input: a made-up Forgejo token string, never valid anywhere."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)tests/e2e/pat\-management\.spec\.ts$''',
]

[[allowlists]]
description = "Unit test fixtures: made-up GitHub token strings (ghp_ followed by placeholder text) that exercise token detection and validation."
targetRules = ["github-pat"]
paths = [
  '''(^|/)tests/unit/Controller/PatCreateGoldenTest\.php$''',
  '''(^|/)tests/unit/Controller/fixtures/pat\-create\.golden\.json$''',
  '''(^|/)tests/unit/Service/Pat/PatManagerTest\.php$''',
  '''(^|/)tests/unit/Service/Pat/PatValidatorTest\.php$''',
]
