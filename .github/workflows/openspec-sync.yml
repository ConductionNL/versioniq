name: OpenSpec Sync

on:
  push:
    branches: [development]
    paths: ['openspec/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    permissions:
      issues: write
      contents: read
    uses: ConductionNL/.github/.github/workflows/openspec-sync.yml@main
    with:
      # FROZEN ON THE OLD NAME through the app_versions -> versioniq rename.
      # This is not read as an app id: the shared workflow matches it against
      # the NAME of an option on the org project board's "App" single-select
      # field (`appField.options.find(o => o.name === appName)`). A value with
      # no matching option is a SILENT no-op — the issue still lands on the
      # board, the App field is simply left unset, and nothing fails.
      #
      # Note it is already neither app id: the old id was `app_versions` with
      # an underscore. This hyphenated spelling is the old REPOSITORY name, so
      # the board option is presumably named that too. It can only move once
      # the option is renamed on the board itself — a change in GitHub, not in
      # this repo — and the two must land together.
      app-name: app-versions
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
