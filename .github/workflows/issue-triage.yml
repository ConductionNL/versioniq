name: Issue Triage

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      backlog-existing:
        description: "Triage all existing untriaged open issues"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  triage:
    permissions:
      issues: write
      contents: read
    uses: ConductionNL/.github/.github/workflows/issue-triage.yml@main
    with:
      # FROZEN ON THE OLD NAME through the app_versions -> versioniq rename —
      # see the matching comment in openspec-sync.yml. The shared workflow
      # matches this against the NAME of an option on the org project board's
      # "App" single-select field, and a value with no matching option fails
      # SILENTLY (the issue is still added; the App field is left unset).
      # Moves only in lockstep with renaming that option on the board.
      app-name: app-versions
      backlog-existing: ${{ github.event_name == 'workflow_dispatch' && inputs.backlog-existing || false }}
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
