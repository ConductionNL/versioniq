version: 2
updates:
  - package-ecosystem: composer
    directories:
      - "/"
      - "/vendor-bin/*"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    target-branch: "development"
    open-pull-requests-limit: 10
    # The composer entry existed but carried NO cooldown, so PHP dependencies
    # updated the moment they were published — which is exactly the window in
    # which a compromised release is still on the registry. Two days is the
    # floor gate-93 enforces.
    #
    # conduction/* is excluded on purpose: a cooldown protects against a
    # compromised UPSTREAM release, and those come from this fleet's own CI.
    # Delaying them would only slow the loop between a fix being released and
    # arriving here.
    cooldown:
      default-days: 2
      include:
        - "*"
      exclude:
        - "conduction/*"
  - package-ecosystem: npm
    # HELD BACK DELIBERATELY. Each is blocked by a package we do not control,
    # so dependabot proposes it every run and each one takes `npm ci` or
    # `npm run build` from green to red with no code change that can fix it.
    # typescript-eslint hard-throws on TS >= 7; @nextcloud/webpack-vue-config
    # 7.0.4 (latest) peers webpack-cli ^6.0.1 and @babel/core ^7.22.9, and
    # preset-env 8 needs core 8, so that pair moves together or not at all.
    # Compatibility limits, not security ones: npm audit reports no advisory
    # against any version pinned here. Lift each when its blocker ships support.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vue-router 5 peers `vite: ^7.3.0 || ^8.0.0` and expects a Vite
      # toolchain. Measured, not assumed, and the result is SPLIT: integriq and
      # zaakafhandelapp fail their build on `Can't resolve 'vue-router'`, while
      # openregister and learniq build clean on 5.3.0. Held because a bump that
      # breaks some apps and not others cannot be merged unattended, and the
      # difference is not yet understood. Adopting it fleet-wide is a
      # Vite migration, not a bump. versioniq is already on Vite and is the
      # natural pilot.
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webpack-cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Europe/Paris
    target-branch: "development"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
      include:
        - "*"
      exclude:
        - "@conduction/*"
